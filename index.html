<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>PDF Manager</title>

    <!-- Favicon -->
    <!-- <link rel="icon" type="image/x-icon" href="../bower_components/images/SOMS-icon.ico"> -->
    <link rel="shortcut icon" type="image/x-icon" href="./images/SOMS-icon.ico">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <script src="./ScriptsJS/3.10.1-jszip.min.js"></script>
    <script src="./ScriptsJS/3.11.174-pdf.min.js"></script>

    <link rel="stylesheet" href="./CSS/index.css">

    <style>
        /* ── Page Loader ─────────────────────────────────────────── */
        #pageLoader {
            position: fixed;
            inset: 0;
            z-index: 99999;
            background: #0a0e1a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0;
            overflow: hidden;
            transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1),
                transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #pageLoader.fade-out {
            opacity: 0;
            transform: scale(1.04);
            pointer-events: none;
        }

        /* Ambient grid background */
        #pageLoader::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(99, 179, 255, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(99, 179, 255, 0.04) 1px, transparent 1px);
            background-size: 48px 48px;
            animation: gridDrift 12s linear infinite;
        }

        @keyframes gridDrift {
            from {
                background-position: 0 0;
            }

            to {
                background-position: 48px 48px;
            }
        }

        /* Glow orbs */
        .loader-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0;
            animation: orbFloat 3s ease-out forwards;
        }

        .loader-orb-1 {
            width: 340px;
            height: 340px;
            background: radial-gradient(circle, #1a4a8a 0%, transparent 70%);
            top: -80px;
            left: -60px;
            animation-delay: 0.1s;
        }

        .loader-orb-2 {
            width: 280px;
            height: 280px;
            background: radial-gradient(circle, #0f3460 0%, transparent 70%);
            bottom: -60px;
            right: -40px;
            animation-delay: 0.3s;
        }

        .loader-orb-3 {
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, #1e3a5f 0%, transparent 70%);
            top: 40%;
            left: 60%;
            animation-delay: 0.5s;
        }

        @keyframes orbFloat {
            to {
                opacity: 1;
            }
        }

        /* Document icon */
        .loader-doc-wrap {
            position: relative;
            margin-bottom: 32px;
            opacity: 0;
            transform: translateY(20px);
            animation: loaderSlideUp 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) 0.3s forwards;
        }

        .loader-doc {
            width: 64px;
            height: 80px;
            background: linear-gradient(145deg, #1e3a6e 0%, #0f2040 100%);
            border-radius: 6px 14px 14px 6px;
            border: 1.5px solid rgba(99, 179, 255, 0.25);
            position: relative;
            box-shadow:
                0 0 0 1px rgba(99, 179, 255, 0.08),
                0 8px 32px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.07);
        }

        /* Folded corner */
        .loader-doc::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 20px;
            height: 20px;
            background: linear-gradient(225deg, #0a0e1a 50%, transparent 50%);
            border-bottom-left-radius: 4px;
        }

        .loader-doc::after {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 20px;
            height: 20px;
            background: linear-gradient(225deg, rgba(99, 179, 255, 0.15) 50%, transparent 50%);
            border-bottom-left-radius: 4px;
        }

        /* Document lines */
        .loader-doc-lines {
            position: absolute;
            left: 12px;
            top: 28px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .loader-doc-line {
            height: 2px;
            background: rgba(99, 179, 255, 0.3);
            border-radius: 2px;
            transform-origin: left;
            transform: scaleX(0);
            animation: lineGrow 0.4s ease-out forwards;
        }

        .loader-doc-line:nth-child(1) {
            width: 32px;
            animation-delay: 0.65s;
        }

        .loader-doc-line:nth-child(2) {
            width: 26px;
            animation-delay: 0.75s;
        }

        .loader-doc-line:nth-child(3) {
            width: 30px;
            animation-delay: 0.85s;
        }

        .loader-doc-line:nth-child(4) {
            width: 22px;
            animation-delay: 0.95s;
        }

        @keyframes lineGrow {
            to {
                transform: scaleX(1);
            }
        }

        /* Second doc (stacked behind) */
        .loader-doc-bg {
            position: absolute;
            width: 60px;
            height: 74px;
            background: linear-gradient(145deg, #162d58 0%, #0b1830 100%);
            border-radius: 6px 12px 12px 6px;
            border: 1.5px solid rgba(99, 179, 255, 0.12);
            top: 6px;
            left: -8px;
            z-index: -1;
        }

        /* Title */
        .loader-title {
            font-family: 'Courier New', 'Lucida Console', monospace;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.35em;
            text-transform: uppercase;
            color: rgba(99, 179, 255, 0.5);
            margin-bottom: 6px;
            opacity: 0;
            animation: loaderFadeIn 0.5s ease 0.9s forwards;
        }

        .loader-name {
            font-family: 'Georgia', 'Times New Roman', serif;
            font-size: 28px;
            font-weight: 700;
            color: #e8f0ff;
            letter-spacing: -0.02em;
            line-height: 1;
            margin-bottom: 32px;
            opacity: 0;
            animation: loaderSlideUp 0.6s cubic-bezier(0.34, 1.2, 0.64, 1) 1.0s forwards;
        }

        .loader-name span {
            color: #63b3ff;
        }

        /* Progress bar */
        .loader-progress-wrap {
            width: 200px;
            position: relative;
            opacity: 0;
            animation: loaderFadeIn 0.4s ease 1.1s forwards;
        }

        .loader-progress-track {
            width: 100%;
            height: 2px;
            background: rgba(99, 179, 255, 0.12);
            border-radius: 2px;
            overflow: hidden;
        }

        .loader-progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #2563eb, #63b3ff, #93c5fd);
            border-radius: 2px;
            animation: progressFill 1.8s cubic-bezier(0.4, 0, 0.2, 1) 1.2s forwards;
            box-shadow: 0 0 8px rgba(99, 179, 255, 0.6);
        }

        @keyframes progressFill {
            0% {
                width: 0%;
            }

            60% {
                width: 75%;
            }

            85% {
                width: 90%;
            }

            100% {
                width: 100%;
            }
        }

        /* Status text */
        .loader-status {
            margin-top: 10px;
            font-family: 'Courier New', monospace;
            font-size: 10px;
            letter-spacing: 0.15em;
            color: rgba(99, 179, 255, 0.4);
            text-transform: uppercase;
            opacity: 0;
            animation: loaderFadeIn 0.4s ease 1.2s forwards;
        }

        .loader-status-text {
            display: inline-block;
        }

        /* Shared animations */
        @keyframes loaderSlideUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes loaderFadeIn {
            to {
                opacity: 1;
            }
        }

        /* Corner accents */
        .loader-corner {
            position: absolute;
            width: 20px;
            height: 20px;
            opacity: 0;
            animation: loaderFadeIn 0.6s ease 0.5s forwards;
        }

        .loader-corner::before,
        .loader-corner::after {
            content: '';
            position: absolute;
            background: rgba(99, 179, 255, 0.35);
        }

        .loader-corner::before {
            width: 2px;
            height: 100%;
        }

        .loader-corner::after {
            width: 100%;
            height: 2px;
        }

        .loader-corner-tl {
            top: 24px;
            left: 24px;
        }

        .loader-corner-tl::before {
            top: 0;
            left: 0;
        }

        .loader-corner-tl::after {
            top: 0;
            left: 0;
        }

        .loader-corner-tr {
            top: 24px;
            right: 24px;
            transform: rotate(90deg);
        }

        .loader-corner-br {
            bottom: 24px;
            right: 24px;
            transform: rotate(180deg);
        }

        .loader-corner-bl {
            bottom: 24px;
            left: 24px;
            transform: rotate(270deg);
        }

        /* Main App Styles (preserved from original) */
        :root {
            --bg-primary: #0f1219;
            --bg-secondary: #1a1f2b;
            --bg-elevated: #232835;
            --text-primary: #eef2ff;
            --text-secondary: #9aa4bf;
            --accent: #3b82f6;
            --border: #2d3342;
        }

        body {
            margin: 0;
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }

        .sticky-header-container {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(15, 18, 25, 0.95);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--border);
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 24px;
        }

        .title {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.3rem;
            font-weight: 600;
        }

        .back-btn {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: var(--text-primary);
        }

        .top-bar-actions {
            display: flex;
            gap: 12px;
        }

        .hamburger-btn, .theme-toggle {
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            padding: 6px 12px;
            border-radius: 30px;
            cursor: pointer;
            color: var(--text-primary);
        }

        .tool-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 12px 24px;
            border-top: 1px solid var(--border);
        }

        .tab-btn {
            background: var(--bg-elevated);
            border: none;
            padding: 8px 18px;
            border-radius: 40px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            color: var(--text-secondary);
            transition: 0.2s;
        }

        .tab-btn.active {
            background: var(--accent);
            color: white;
        }

        .split-controls {
            display: none;
            padding: 12px 24px;
            background: var(--bg-elevated);
            border-top: 1px solid var(--border);
        }

        .split-controls.active, .split-controls.show {
            display: block;
        }

        .split-controls-content {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
        }

        .split-every-section, .merge-info-section {
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--bg-primary);
            padding: 6px 16px;
            border-radius: 40px;
        }

        .split-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .btn {
            border: none;
            padding: 8px 18px;
            border-radius: 40px;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .btn-primary {
            background: var(--accent);
            color: white;
        }

        .btn-secondary {
            background: var(--bg-primary);
            color: var(--text-primary);
            border: 1px solid var(--border);
        }

        .split-count-badge {
            background: rgba(255,255,255,0.2);
            border-radius: 30px;
            padding: 2px 8px;
            font-size: 0.8rem;
        }

        .app-layout {
            display: flex;
            min-height: calc(100vh - 150px);
        }

        .left-panel {
            width: 280px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px;
            border-bottom: 1px solid var(--border);
        }

        .files-container {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
        }

        .empty-files {
            text-align: center;
            color: var(--text-secondary);
            padding: 40px 20px;
        }

        .main-content {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
        }

        .upload-section {
            border: 2px dashed var(--border);
            border-radius: 24px;
            padding: 32px;
            text-align: center;
            margin-bottom: 32px;
            cursor: pointer;
            background: var(--bg-elevated);
        }

        .upload-icon {
            font-size: 48px;
            margin-bottom: 12px;
        }

        .file-input {
            display: none;
        }

        .page-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 20px;
        }

        .preview-modal, .processing-overlay, .notification-modal, .confirm-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .preview-modal-content, .processing-content, .notification-content, .confirm-content {
            background: var(--bg-secondary);
            border-radius: 24px;
            padding: 20px;
            max-width: 90vw;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        #toast-container {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1100;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .toast-item {
            background: var(--bg-elevated);
            padding: 10px 20px;
            border-radius: 40px;
            font-size: 14px;
            opacity: 0;
            transition: 0.2s;
        }

        .toast-item.show { opacity: 1; }

        .mode-loading-overlay {
            display: none;
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.6);
            z-index: 200;
            align-items: center;
            justify-content: center;
        }

        @media (max-width: 680px) {
            .left-panel { display: none; }
            .mobile-menu-toggle { display: block; }
        }
    </style>
</head>

<body>

    <!-- ── Page Loader (shows once per session) ── -->
    <div id="pageLoader">
        <div class="loader-orb loader-orb-1"></div>
        <div class="loader-orb loader-orb-2"></div>
        <div class="loader-orb loader-orb-3"></div>
        <div class="loader-corner loader-corner-tl"></div>
        <div class="loader-corner loader-corner-tr"></div>
        <div class="loader-corner loader-corner-br"></div>
        <div class="loader-corner loader-corner-bl"></div>
        <div class="loader-doc-wrap">
            <div class="loader-doc-bg"></div>
            <div class="loader-doc">
                <div class="loader-doc-lines">
                    <div class="loader-doc-line"></div>
                    <div class="loader-doc-line"></div>
                    <div class="loader-doc-line"></div>
                    <div class="loader-doc-line"></div>
                </div>
            </div>
        </div>
        <div class="loader-title">Cronasia Foundation College, Inc.</div>
        <div class="loader-name">PDF <span>Manager</span></div>
        <div class="loader-progress-wrap">
            <div class="loader-progress-track">
                <div class="loader-progress-fill"></div>
            </div>
            <div class="loader-status">
                <span class="loader-status-text">Initializing…</span>
            </div>
        </div>
    </div>

    <!-- Fixed Sticky Header Container -->
    <div class="sticky-header-container">
        <div class="top-bar">
            <div class="title">
                <button class="back-btn" onclick="window.history.back()">←</button>
                <span>✂️ Split PDF</span>
            </div>
            <div class="top-bar-actions">
                <button class="hamburger-btn" id="hamburgerBtn" onclick="toggleMobileMenu()">☰</button>
                <button class="theme-toggle" onclick="toggleTheme()">
                    <span id="themeIcon">🌙</span>
                    <span id="themeText">Dark</span>
                </button>
            </div>
        </div>

        <div class="tool-tabs" id="toolTabs">
            <button class="tab-btn active" id="splitTab" onclick="switchToSplit()"><span>✂️</span><span>Split</span></button>
            <button class="tab-btn" id="mergeTab" onclick="switchToMerge()"><span>🔗</span><span>Merge</span></button>
            <button class="tab-btn" id="stampTab" onclick="switchToStamp()"><span>🖋️</span><span>Stamp</span></button>
            <button class="tab-btn" onclick="showToast('🔄 Rotate Pages feature coming soon!')"><span>🔄</span><span>Rotate</span></button>
            <button class="tab-btn" onclick="showToast('🗑️ Delete Pages feature coming soon!')"><span>🗑️</span><span>Delete Pages</span></button>
            <button class="tab-btn" onclick="showToast('📄 Extract Pages feature coming soon!')"><span>📄</span><span>Extract</span></button>
        </div>

        <div class="split-controls" id="splitControls">
            <div class="split-controls-content">
                <div class="split-every-section">
                    <label><input type="checkbox" id="splitEveryCheckbox" onchange="toggleSplitEvery()"><span>Split after every</span></label>
                    <input type="number" id="splitEveryInput" min="1" value="1" disabled>
                    <label><span>pages</span></label>
                </div>
                <div class="split-actions">
                    <button class="btn btn-secondary" onclick="clearAllSplitPoints()"><span>🗑️</span><span>Clear All</span></button>
                    <button class="btn btn-secondary" onclick="showResetConfirm()"><span>↻</span><span>New File</span></button>
                    <button class="btn btn-primary" id="splitBtn" onclick="executeSplit()" disabled><span>✂️</span><span>Split into</span><span class="split-count-badge" id="splitCountBtn">1</span><span>PDFs</span></button>
                </div>
            </div>
        </div>

        <div class="split-controls" id="mergeControls">
            <div class="split-controls-content">
                <div class="merge-info-section"><span>📚 Drag files or pages to reorder</span><span id="mergeTotalPages" style="margin-left: 15px;"></span></div>
                <div class="split-actions">
                    <button class="btn btn-secondary" onclick="addMoreMergeFiles()"><span>➕</span><span>Add Files</span></button>
                    <button class="btn btn-secondary" onclick="clearAllMergeFiles()"><span>🗑️</span><span>Clear All</span></button>
                    <button class="btn btn-secondary" onclick="showResetConfirm()"><span>↻</span><span>New Merge</span></button>
                    <button class="btn btn-primary" id="mergeBtn" onclick="executeMerge()" disabled><span>🔗</span><span>Merge</span><span class="split-count-badge" id="mergeCountBtn">0</span><span id="mergeFilesText">files</span></button>
                </div>
            </div>
        </div>
    </div>

    <div class="mobile-overlay" id="mobileOverlay" onclick="toggleMobileMenu()"></div>
    <button class="mobile-menu-toggle" id="mobileMenuToggle" onclick="toggleLeftPanel()">📁</button>

    <div class="app-layout">
        <div class="left-panel" id="leftPanel">
            <div class="panel-header">
                <h3 id="panelTitle">📁 Uploaded Files (0)</h3>
                <button class="collapse-btn" id="collapseBtn" onclick="toggleLeftPanel()"><i class="fa fa-angle-double-left" style="font-size:24px"></i></button>
            </div>
            <div class="files-container" id="filesContainer">
                <div class="empty-files"><div style="font-size: 32px; margin-bottom: 10px;">📄</div><span>No files uploaded yet</span></div>
            </div>
        </div>

        <div class="main-content">
            <div class="mode-loading-overlay" id="modeLoadingOverlay"><div class="mode-loading-spinner"></div><div class="mode-loading-text" id="modeLoadingText">Switching mode...</div></div>

            <div class="upload-section" id="uploadSection">
                <div class="upload-box" onclick="document.getElementById('fileInput').click()">
                    <div class="upload-icon">📄</div>
                    <div class="upload-text">Click to upload or drag & drop</div>
                    <div class="upload-subtext">PDF files only (multiple files allowed)</div>
                </div>
                <input type="file" id="fileInput" class="file-input" accept=".pdf" multiple onchange="handleFileSelect(event)">
            </div>

            <div class="page-container" id="pageContainer">
                <div class="page-grid" id="pageGrid"></div>
            </div>

            <div id="stampContainer" style="display:none"></div>
        </div>
    </div>

    <div class="preview-modal" id="previewModal" onclick="closePreview(event)">
        <div class="preview-modal-content" onclick="event.stopPropagation()">
            <button class="preview-close" onclick="closePreview()">×</button>
            <div class="preview-canvas-wrapper" id="previewCanvasWrapper"></div>
            <div class="preview-bottom-bar">
                <button class="preview-nav-btn" onclick="zoomPreview(-0.25)">−</button><span id="previewZoomLevel">100%</span>
                <button class="preview-nav-btn" onclick="zoomPreview(0.25)">+</button><button class="preview-nav-btn" onclick="fitPreview()">⊞</button>
                <button class="preview-nav-btn" id="previewPrevBtn" onclick="navigatePreview(-1)">←</button><span id="previewPageCounter">1 / 1</span>
                <button class="preview-nav-btn" id="previewNextBtn" onclick="navigatePreview(1)">→</button>
                <button class="preview-nav-btn" onclick="rotatePreview(-90)">↺</button><button class="preview-nav-btn" onclick="rotatePreview(90)">↻</button>
                <button class="preview-nav-btn danger" onclick="deletePreviewPage()">🗑️</button>
            </div>
        </div>
    </div>

    <div class="processing-overlay" id="processingOverlay"><div class="processing-content"><div class="spinner"></div><div class="processing-text">Loading PDF...</div><div class="processing-subtext">Please wait</div></div></div>
    <div class="notification-modal" id="notificationModal"><div class="notification-content"><div class="notification-header">ℹ️</div><div class="notification-message"></div><button onclick="closeNotification()">OK</button></div></div>
    <div class="confirm-modal" id="confirmModal"><div class="confirm-content"><div class="confirm-header">⚠️</div><div class="confirm-message"></div><button id="confirmCancelBtn">Cancel</button><button id="confirmOkBtn">OK</button></div></div>
    <div id="toast-container"></div>

    <script>
        // Core placeholders to maintain original structure
        window.PDF_MANAGER_BASE = '';
        let activeTool = 'split';
        window.activeTool = 'split';

        function showToast(msg) { let c = document.getElementById('toast-container'); if(c){ let t=document.createElement('div'); t.className='toast-item'; t.innerText=msg; c.appendChild(t); setTimeout(()=>t.classList.add('show'),10); setTimeout(()=>t.remove(),3000); } else alert(msg); }
        function showConfirm(title, msg, callback) { if(confirm(msg)) callback(); }
        function showModeLoading(t) { console.log(t); }
        function hideModeLoading() {}
        function toggleSplitEvery() { let chk=document.getElementById('splitEveryCheckbox'), inp=document.getElementById('splitEveryInput'); if(inp) inp.disabled=!chk.checked; }
        function clearAllSplitPoints() { showToast('Split points cleared (demo)'); }
        function showResetConfirm() { if(confirm('Start over with new files? All progress lost.')) location.reload(); }
        function executeSplit() { showToast('Split functionality ready - integrate backend'); }
        function addMoreMergeFiles() { document.getElementById('fileInput').click(); }
        function clearAllMergeFiles() { showToast('Merge files cleared'); }
        function executeMerge() { showToast('Merge ready - integrate PDF assembly'); }
        function handleFileSelect(e) { showToast(e.target.files.length+' file(s) selected'); }
        function toggleMobileMenu() { let ov=document.getElementById('mobileOverlay'); if(ov) ov.style.display=ov.style.display==='block'?'none':'block'; }
        function toggleLeftPanel() { let p=document.getElementById('leftPanel'); if(p) p.style.display=p.style.display==='none'?'flex':'none'; }
        function toggleTheme() { document.body.style.backgroundColor=document.body.style.backgroundColor==='#0f1219'?'#f0f2f5':'#0f1219'; }
        function switchToSplit() { activeTool='split'; document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active')); document.getElementById('splitTab').classList.add('active'); document.getElementById('splitControls').classList.add('active'); document.getElementById('mergeControls').classList.remove('active'); document.getElementById('stampContainer').style.display='none'; document.getElementById('uploadSection').style.display='block'; document.getElementById('pageContainer').style.display='block'; document.getElementById('leftPanel').style.display='flex'; document.querySelector('.title span').innerHTML='✂️ Split PDF'; }
        function switchToMerge() { activeTool='merge'; document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active')); document.getElementById('mergeTab').classList.add('active'); document.getElementById('splitControls').classList.remove('active'); document.getElementById('mergeControls').classList.add('active'); document.getElementById('stampContainer').style.display='none'; document.getElementById('uploadSection').style.display='block'; document.getElementById('pageContainer').style.display='none'; document.getElementById('leftPanel').style.display='flex'; document.querySelector('.title span').innerHTML='🔗 Merge PDF'; }
        function switchToStamp() { activeTool='stamp'; document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active')); document.getElementById('stampTab').classList.add('active'); document.getElementById('splitControls').classList.remove('active'); document.getElementById('mergeControls').classList.remove('active'); document.getElementById('uploadSection').style.display='none'; document.getElementById('pageContainer').style.display='none'; document.getElementById('leftPanel').style.display='none'; document.getElementById('stampContainer').style.display='block'; document.querySelector('.title span').innerHTML='🖋️ Stamp PDF'; }
        function closePreview(e) { document.getElementById('previewModal').style.display='none'; }
        function zoomPreview(delta) { showToast('Zoom demo'); }
        function fitPreview() { showToast('Fit preview'); }
        function navigatePreview(dir) { showToast('Navigate page'); }
        function rotatePreview(deg) { showToast('Rotate preview'); }
        function deletePreviewPage() { showToast('Delete page demo'); }
        function closeNotification() { document.getElementById('notificationModal').style.display='none'; }

        // Page loader dismiss logic
        (function() {
            if(sessionStorage.getItem('pdfMgrLoaded')) { document.getElementById('pageLoader').style.display='none'; return; }
            setTimeout(()=>{ let l=document.getElementById('pageLoader'); if(l){ l.classList.add('fade-out'); setTimeout(()=>{ l.style.display='none'; sessionStorage.setItem('pdfMgrLoaded','1'); },600); } },3000);
        })();
    </script>
</body>
</html>
